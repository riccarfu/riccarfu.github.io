<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Age Finder</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.person {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

button {
    padding: 8px 14px;
    margin-right: 8px;
}

.result {
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fafafa;
}

.pair-title {
    font-weight: bold;
    margin-bottom: 8px;
}
</style>
</head>
<body>

<h1>Palindrome Age Finder</h1>

<p>
Find the previous and next two dates where two people's ages are
digit reversals of each other (e.g. 15 ↔ 51, 24 ↔ 42, 103 ↔ 301).
</p>

<div id="people-container">
    <div class="person">
        <label>Person 1</label>
        <input type="date" class="dob">
    </div>

    <div class="person">
        <label>Person 2</label>
        <input type="date" class="dob">
    </div>
</div>

<button id="addPerson">Add Person</button>
<button id="calculate">Calculate</button>

<div id="results"></div>

<script src="script.js"></script>
</body>
</html>
