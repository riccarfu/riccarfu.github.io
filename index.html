<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Age Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="date"] {
            padding: 6px;
        }

        button {
            padding: 8px 14px;
            margin-right: 10px;
            cursor: pointer;
        }

        #results {
            margin-top: 25px;
        }

        .result {
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f9f9f9;
        }

        .pair-title {
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <h1>Palindrome Age Finder</h1>

    <p>
        Enter two or more birth dates. The app will find the next date when
        each pair of people have ages that are digit reversals of each other
        (e.g. 15 & 51, 24 & 42, 103 & 301).
    </p>

    <div id="people-container">
        <div class="person">
            <label>Person 1</label>
            <input type="date" class="dob">
        </div>

        <div class="person">
            <label>Person 2</label>
            <input type="date" class="dob">
        </div>
    </div>

    <button id="addPerson">Add Person</button>
    <button id="calculate">Find Palindrome Ages</button>

    <div id="results"></div>

    <script src="script.js"></script>

</body>
</html>
