<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Age Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .person label {
            width: 90px;
        }

        input[type="date"] {
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 9px 15px;
            margin-top: 10px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        #addPerson {
            background: #e5e5e5;
        }

        #calculate {
            background: #222;
            color: white;
        }

        #results {
            margin-top: 30px;
        }

        .result {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .pair-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .date-row:last-child {
            border-bottom: none;
        }

        .date {
            font-weight: bold;
        }

        .ages {
            color: #666;
            margin-left: 8px;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

    <h1>Palindrome Age Calculator</h1>

    <p class="description">
        Enter two or more dates of birth. For every pair of people,
        the calculator finds the most recent palindrome-age date
        and the next two.
    </p>

    <div id="people-container">

        <div class="person">
            <label>Person 1</label>
            <input type="date" class="dob">
        </div>

        <div class="person">
            <label>Person 2</label>
            <input type="date" class="dob">
        </div>

    </div>

    <button id="addPerson">Add Person</button>
    <button id="calculate">Calculate</button>

    <div id="results"></div>

    <script src="script.js"></script>

</body>
</html>
